name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write

jobs:
  linux-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"

          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            previous="$(git show HEAD^:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
            if [[ "$version" == "$previous" ]]; then
              echo "Package version did not change; skipping release."
              exit 0
            fi
          elif [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version."
            exit 1
          fi

          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.release_tag.outputs.tag != ''
        run: npm ci

      - name: Run test suite
        if: steps.release_tag.outputs.tag != ''
        run: npm test

      - name: Build Linux AppImage
        if: steps.release_tag.outputs.tag != ''
        run: npm run dist:linux

      - name: Generate checksums
        if: steps.release_tag.outputs.tag != ''
        run: sha256sum dist/*.AppImage > dist/sha256sums.txt

      - name: Upload release artifacts
        if: steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
